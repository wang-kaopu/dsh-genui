name: Windows esbuild investigation

on:
  push:
    branches:
      - chore/windows-esbuild-investigation
  workflow_dispatch:

jobs:
  isolated-esbuild:
    name: isolated / Node ${{ matrix.node }} / esbuild ${{ matrix.esbuild }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24.18.0"
        esbuild:
          - "0.25.12"
          - "0.28.2"

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show environment
        shell: pwsh
        run: |
          node -v
          npm -v
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "ComSpec=$env:ComSpec"
          Write-Host "NODE_OPTIONS=$env:NODE_OPTIONS"
          Write-Host "ESBUILD_BINARY_PATH=$env:ESBUILD_BINARY_PATH"

      # Ignore lifecycle scripts first so postinstall cannot hide the lower-level
      # direct-exe / child_process / JS-shim comparison we actually want.
      - name: Install esbuild without lifecycle scripts
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "esbuild-isolated"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Location $dir
          npm init -y
          npm install "esbuild@${{ matrix.esbuild }}" --ignore-scripts
          node -e "console.log('installed esbuild=', require('esbuild/package.json').version)"

      - name: Compare native exe, Node child_process and JS shim
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "esbuild-isolated"
          Set-Location $dir

          $exe = node -e "console.log(require.resolve('@esbuild/win32-x64/esbuild.exe'))"
          Write-Host "native exe=$exe"

          Write-Host "=== PowerShell -> native exe ==="
          & $exe --version
          Write-Host "exit=$LASTEXITCODE"

          @'
          const { execFileSync, spawnSync } = require('node:child_process')

          const exe = process.argv[2]

          function printable(value) {
            if (Buffer.isBuffer(value)) return value.toString('utf8')
            return value
          }

          function dump(label, result) {
            console.log(`=== ${label} ===`)
            console.log({
              error: result.error && {
                name: result.error.name,
                message: result.error.message,
                code: result.error.code,
                errno: result.error.errno,
                syscall: result.error.syscall,
                path: result.error.path,
              },
              status: result.status,
              signal: result.signal,
              stdout: printable(result.stdout),
              stderr: printable(result.stderr),
            })
          }

          dump(
            'spawnSync native exe / pipe',
            spawnSync(exe, ['--version'], { encoding: 'utf8', stdio: 'pipe' }),
          )

          console.log('=== spawnSync native exe / inherit ===')
          const inherited = spawnSync(exe, ['--version'], { stdio: 'inherit' })
          console.log({
            error: inherited.error && {
              name: inherited.error.name,
              message: inherited.error.message,
              code: inherited.error.code,
              errno: inherited.error.errno,
            },
            status: inherited.status,
            signal: inherited.signal,
          })

          console.log('=== execFileSync native exe / pipe ===')
          try {
            const stdout = execFileSync(exe, ['--version'], {
              encoding: 'utf8',
              stdio: 'pipe',
            })
            console.log({ stdout: JSON.stringify(stdout) })
          } catch (error) {
            console.log({
              name: error.name,
              message: error.message,
              code: error.code,
              errno: error.errno,
              status: error.status,
              signal: error.signal,
              stdout: printable(error.stdout),
              stderr: printable(error.stderr),
            })
          }

          dump(
            'node bin/esbuild --version',
            spawnSync(
              process.execPath,
              ['node_modules/esbuild/bin/esbuild', '--version'],
              { encoding: 'utf8', stdio: 'pipe' },
            ),
          )

          dump(
            'esbuild install.js (postinstall)',
            spawnSync(
              process.execPath,
              ['node_modules/esbuild/install.js'],
              { encoding: 'utf8', stdio: 'pipe' },
            ),
          )
          '@ | Set-Content -Encoding utf8 diagnose-esbuild.cjs

          node diagnose-esbuild.cjs $exe

      # Turn the interesting observations into the job conclusion so the result
      # can be read from the Actions API without manually opening Windows logs.
      - name: Assert native exe, child_process, shim and postinstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "esbuild-isolated"
          Set-Location $dir
          $exe = node -e "console.log(require.resolve('@esbuild/win32-x64/esbuild.exe'))"

          @'
          const { execFileSync, spawnSync } = require('node:child_process')

          const exe = process.argv[2]
          const expected = process.argv[3]
          const failures = []

          function checkSpawn(label, command, args) {
            const result = spawnSync(command, args, {
              encoding: 'utf8',
              stdio: 'pipe',
            })
            const stdout = (result.stdout || '').trim()
            if (result.error || result.status !== 0 || stdout !== expected) {
              failures.push({
                label,
                error: result.error && {
                  message: result.error.message,
                  code: result.error.code,
                  errno: result.error.errno,
                },
                status: result.status,
                signal: result.signal,
                stdout: result.stdout,
                stderr: result.stderr,
              })
            }
          }

          checkSpawn('spawnSync native exe', exe, ['--version'])

          try {
            const stdout = execFileSync(exe, ['--version'], {
              encoding: 'utf8',
              stdio: 'pipe',
            }).trim()
            if (stdout !== expected) {
              failures.push({ label: 'execFileSync native exe', stdout })
            }
          } catch (error) {
            failures.push({
              label: 'execFileSync native exe',
              error: {
                message: error.message,
                code: error.code,
                errno: error.errno,
                status: error.status,
              },
              stdout: error.stdout && error.stdout.toString(),
              stderr: error.stderr && error.stderr.toString(),
            })
          }

          checkSpawn(
            'node bin/esbuild',
            process.execPath,
            ['node_modules/esbuild/bin/esbuild', '--version'],
          )

          const install = spawnSync(
            process.execPath,
            ['node_modules/esbuild/install.js'],
            { encoding: 'utf8', stdio: 'pipe' },
          )
          if (install.error || install.status !== 0) {
            failures.push({
              label: 'esbuild install.js',
              error: install.error && {
                message: install.error.message,
                code: install.error.code,
                errno: install.error.errno,
              },
              status: install.status,
              signal: install.signal,
              stdout: install.stdout,
              stderr: install.stderr,
            })
          }

          if (failures.length) {
            console.error('esbuild path assertion failed:')
            console.error(JSON.stringify(failures, null, 2))
            process.exit(1)
          }

          console.log(`all esbuild paths returned ${expected}`)
          '@ | Set-Content -Encoding utf8 assert-esbuild.cjs

          node assert-esbuild.cjs $exe "${{ matrix.esbuild }}"

  historical-git-prepare:
    name: historical git prepare / Node 24.18.0 / pnpm 11.21.0
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      # Avoid pnpm/action-setup and Corepack selecting the repository's pnpm.
      # Invoke the globally installed historical package through node directly.
      - name: Install historical pnpm
        shell: pwsh
        run: |
          npm install --global pnpm@11.21.0
          $globalRoot = npm root --global
          $pnpmCli = Join-Path $globalRoot "pnpm\bin\pnpm.cjs"
          if (-not (Test-Path $pnpmCli)) {
            throw "pnpm CLI not found at $pnpmCli"
          }
          node $pnpmCli --version
          "HISTORICAL_PNPM_CLI=$pnpmCli" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Show environment
        shell: pwsh
        run: |
          node -v
          node "$env:HISTORICAL_PNPM_CLI" --version
          Write-Host "HISTORICAL_PNPM_CLI=$env:HISTORICAL_PNPM_CLI"
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "ComSpec=$env:ComSpec"
          Write-Host "NODE_OPTIONS=$env:NODE_OPTIONS"
          Write-Host "ESBUILD_BINARY_PATH=$env:ESBUILD_BINARY_PATH"

      # The harness itself always exits 0 after recording the child process
      # result. A failed historical install is evidence, not a workflow error.
      - name: Replay issue 90 git-hosted prepare
        id: prepare
        shell: pwsh
        run: node .github/scripts/replay-issue-90.cjs "$env:RUNNER_TEMP"

      - name: CLASSIFICATION - esbuild empty stdout reproduced
        if: steps.prepare.outputs.esbuild_empty == 'true'
        shell: pwsh
        run: Write-Host 'The Expected <version> but got empty stdout signature was reproduced.'

      - name: CLASSIFICATION - prepack EINVAL reproduced
        if: steps.prepare.outputs.prepack_einval == 'true'
        shell: pwsh
        run: Write-Host 'The independent Windows prepack EINVAL signature was reproduced.'

      - name: CLASSIFICATION - pnpm git prepare restriction reproduced
        if: steps.prepare.outputs.git_prepare_not_allowed == 'true'
        shell: pwsh
        run: Write-Host 'ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED was reproduced.'

      - name: CLASSIFICATION - historical git install succeeded
        if: steps.prepare.outputs.pnpm_exit == '0'
        shell: pwsh
        run: Write-Host 'The historical Git dependency completed successfully on this clean Windows runner.'

      - name: CLASSIFICATION - other git prepare failure
        if: >-
          steps.prepare.outputs.pnpm_exit != '0' &&
          steps.prepare.outputs.esbuild_empty != 'true' &&
          steps.prepare.outputs.prepack_einval != 'true' &&
          steps.prepare.outputs.git_prepare_not_allowed != 'true'
        shell: pwsh
        run: Write-Host 'The historical Git dependency failed with a different signature.'

      - name: Upload prepare log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-90-git-prepare-node-24
          path: |
            ${{ runner.temp }}/issue-90-git-prepare.log
            ${{ runner.temp }}/issue-90-git-prepare.stdout.log
            ${{ runner.temp }}/issue-90-git-prepare.stderr.log
          if-no-files-found: warn
