name: Temporary GenUI schema verification

on:
  push:
    branches:
      - automation/genui-runtime-schema-extract

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/genui-runtime-schema-extract
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Remove guard facade and migrate direct callers
        shell: python
        run: |
          from pathlib import Path

          guard_path = Path('src/client/guard.ts')
          guard = guard_path.read_text()
          facade = """export { COMPONENT_SCHEMAS, GENUI_NATIVE_TYPES } from './genui-runtime/schema.ts'\nexport { normalizeGenuiSpec } from './genui-runtime/normalize.ts'\nexport { diagnoseUnknownGenuiFields } from './genui-runtime/diagnostics.ts'\nexport type { ComponentFieldKind, ComponentSchema } from './genui-runtime/schema.ts'\nexport type { GenuiDiagnostic } from './genui-runtime/diagnostics.ts'\n\n"""
          if facade not in guard:
              raise SystemExit('guard facade block not found')
          guard_path.write_text(guard.replace(facade, '', 1))

          test_path = Path('tests/genui-schema.spec.ts')
          test = test_path.read_text()
          old = """import {\n  COMPONENT_SCHEMAS,\n  diagnoseUnknownGenuiFields,\n  normalizeGenuiSpec,\n  processGenuiSpec,\n  repairGenuiSpec,\n  validateGenuiSpec,\n} from '../src/client/guard.ts'\n"""
          new = """import { processGenuiSpec, repairGenuiSpec, validateGenuiSpec } from '../src/client/guard.ts'\nimport { COMPONENT_SCHEMAS } from '../src/client/genui-runtime/schema.ts'\nimport { normalizeGenuiSpec } from '../src/client/genui-runtime/normalize.ts'\nimport { diagnoseUnknownGenuiFields } from '../src/client/genui-runtime/diagnostics.ts'\n"""
          if old not in test:
              raise SystemExit('genui-schema import block not found')
          test_path.write_text(test.replace(old, new, 1))

      - name: Build differential characterization test
        shell: bash
        run: |
          git show 397d6b49bd8937c36e8c89bc1243ba67a861925b:src/client/component-schema.ts > tests/__legacy-component-schema.ts
          cat > tests/__schema-extraction-diff.spec.ts <<'EOF'
          import { describe, expect, it } from 'vitest'
          import * as legacy from './__legacy-component-schema.ts'
          import { COMPONENT_SCHEMAS, GENUI_NATIVE_TYPES, GENUI_SPEC_SCHEMA } from '../src/client/genui-runtime/schema.ts'
          import { normalizeGenuiSpec } from '../src/client/genui-runtime/normalize.ts'
          import { diagnoseUnknownGenuiFields } from '../src/client/genui-runtime/diagnostics.ts'

          const fixtures: Array<[string, unknown]> = [
            ['all aliases', { items: [
              { type: 'badge', text: 'badge' },
              { type: 'callout', kind: 'warning', content: 'notice' },
              { type: 'card', label: 'title', content: [{ type: 'text', text: 'body' }] },
              { type: 'steps', items: [{ title: 'one' }] },
              { type: 'table', headers: ['name'], data: [['apple']] },
              { type: 'text', text: 'legacy' },
            ] }],
            ['canonical wins', { items: [
              { type: 'card', title: 'canonical', label: 'legacy', items: [], content: [{ type: 'text', content: 'ignored' }] },
              { type: 'table', columns: ['canonical'], headers: ['legacy'], rows: [], data: [['ignored']] },
            ] }],
            ['tabs structural alias', { items: [{
              type: 'tabs',
              tabs: [
                { label: 'single', content: { type: 'text', text: 'one' } },
                { label: 'array', items: [{ type: 'card', label: 'nested', content: [] }] },
              ],
            }] }],
            ['accordion nested children', { items: [{
              type: 'accordion',
              items: [{ title: 'section', items: [{ type: 'text', text: 'nested' }] }],
            }] }],
            ['nested diagnostics', {
              titel: 'typo',
              items: [
                { type: 'chart', data: [{ label: 'A', value: 1, colour: '#fff' }], series: [{ label: 'S', data: [{ label: 'B', value: 2, valye: 3 }] }] },
                { type: 'tabs', tabs: [{ label: 'Tab', items: [], labell: 'typo' }] },
                { type: 'accordion', items: [{ title: 'Panel', items: [], titlle: 'typo' }] },
                { type: 'diagram', kind: 'flowchart', nodes: [{ id: 'a', label: 'A', labell: 'typo' }], edges: [{ from: 'a', to: 'a', too: 'typo' }], zones: [{ label: 'Z', labell: 'typo' }], theme: { accent: '#fff', acccent: '#000' } },
              ],
            }],
            ['custom node stays opaque', { items: [{ type: 'custom-widget', text: 'legacy', typo: true, nested: { type: 'card', label: 'opaque' } }] }],
            ['bare native component', { type: 'text', text: 'bare', extension: true }],
            ['plain root', { title: 'root', panel: true, append: false, gap: 8, items: [] }],
            ['non-object', 'raw string'],
          ]

          describe('GenUI schema extraction differential', () => {
            it('preserves schema registry exactly', () => {
              expect(COMPONENT_SCHEMAS).toEqual(legacy.COMPONENT_SCHEMAS)
              expect(GENUI_SPEC_SCHEMA).toEqual(legacy.GENUI_SPEC_SCHEMA)
              expect([...GENUI_NATIVE_TYPES]).toEqual([...legacy.GENUI_NATIVE_TYPES])
            })

            for (const [name, value] of fixtures) {
              it(`preserves normalize output: ${name}`, () => {
                expect(normalizeGenuiSpec(value)).toEqual(legacy.normalizeGenuiSpec(value))
              })

              it(`preserves diagnostics: ${name}`, () => {
                expect(diagnoseUnknownGenuiFields(value)).toEqual(legacy.diagnoseUnknownGenuiFields(value))
              })
            }
          })
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Differential and existing schema tests
        run: pnpm exec vitest run tests/__schema-extraction-diff.spec.ts tests/genui-schema.spec.ts

      - name: Full check
        run: pnpm run check

      - name: Remove temporary verification files
        run: |
          rm tests/__legacy-component-schema.ts
          rm tests/__schema-extraction-diff.spec.ts
          rm .github/workflows/tmp-verify-genui-schema.yml

      - name: Verify final module boundaries
        run: |
          test ! -e src/client/component-schema.ts
          test -f src/client/genui-runtime/schema.ts
          test -f src/client/genui-runtime/normalize.ts
          test -f src/client/genui-runtime/diagnostics.ts
          ! git grep -n "component-schema" -- ':!docs/**'
          ! git grep -n "^export .*COMPONENT_SCHEMAS" -- src/client/guard.ts
          ! git grep -n "^export .*GENUI_NATIVE_TYPES" -- src/client/guard.ts
          ! git grep -n "^export .*normalizeGenuiSpec" -- src/client/guard.ts
          ! git grep -n "^export .*diagnoseUnknownGenuiFields" -- src/client/guard.ts
          ! git grep -n "^export type .*ComponentFieldKind" -- src/client/guard.ts
          ! git grep -n "^export type .*GenuiDiagnostic" -- src/client/guard.ts
          git diff --check

      - name: Commit verified boundary cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 收紧 GenUI schema 模块边界"
          git push origin HEAD:automation/genui-runtime-schema-extract
